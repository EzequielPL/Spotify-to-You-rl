[project]
name = "spotyurl"
version = "2.0.0"
description = "Convierte playlists y álbumes públicos de Spotify en enlaces de YouTube"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.3.17",
    "playwright>=1.60",
    "pyperclip>=1.11",
    "pyside6-essentials>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spotyurl = "spotyurl.cli:main"

[project.gui-scripts]
spotyurl-gui = "spotyurl.gui:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spotyurl"]

[tool.setuptools.package-data]
spotyurl = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
